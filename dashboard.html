<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Dashboard</title>
<style>body{font-family:Arial;max-width:500px;margin:40px auto}.card{border:1px solid #ccc;padding:16px;border-radius:8px}button{padding:8px 16px;cursor:pointer}</style></head>
<body>
  <h1>Dashboard</h1>
  <div class="card">
    <p><b>Full Name:</b> <span id="name"></span></p>
    <p><b>Email:</b> <span id="email"></span></p>
    <p><b>Address:</b> <span id="address"></span></p>
    <p><b>Role:</b> <span id="role"></span></p>
  </div><br>
  <button id="logoutBtn">Logout</button>
  <script src="dashboard.js"></script>
</body></html>
